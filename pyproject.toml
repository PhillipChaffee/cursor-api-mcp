[project]
name = "cursor-api-readonly-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Cursor HTTP APIs (Cloud Agents + Admin)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phillip Chaffee" }]
dependencies = [
  "httpx>=0.28.0",
  "mcp[cli]>=1.9.0",
]

[project.scripts]
cursor-api-readonly-mcp = "cursor_api_readonly_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_api_readonly_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
